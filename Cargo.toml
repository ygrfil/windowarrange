[package]
name = "clubgg-table-arranger"
version = "0.5.43"
edition = "2024"
rust-version = "1.97.1"
description = "A focus-safe Windows workspace arranger for ClubGG tables and application windows"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "table-arranger-control"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
crossbeam-channel = "0.5.16"
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
global-hotkey = "0.8.0"
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tray-icon = { version = "0.24.2", default-features = false, features = ["common-controls-v6"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
proptest = "1.11.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
