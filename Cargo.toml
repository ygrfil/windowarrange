[package]
name = "clubgg-table-arranger"
version = "0.4.6"
edition = "2024"
rust-version = "1.97.1"
description = "A focus-safe Windows workspace arranger for ClubGG tables and application windows"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "table-arranger-control"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5.16"
directories = "6.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wgpu"] }
global-hotkey = { version = "0.8.0", features = ["tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tray-icon = { version = "0.24.2", default-features = false, features = ["common-controls-v6"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
proptest = "1.11.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
